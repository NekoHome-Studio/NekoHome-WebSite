<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 185" width="100%" height="100%">
  <style>
    .bg     { fill: var(--bg-base, #FFFFFF); }
    .fg     { fill: var(--text, #1E2229); }
    .accent { fill: var(--accent, #388CE8); }
  </style>

  <defs>
    <!-- 主标题加粗 -->
    <filter id="boldMain" x="-10%" y="-20%" width="120%" height="140%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="0.55" result="d"/>
      <feFlood result="c" style="flood-color: var(--text, #1E2229)"/>
      <feComposite in="c" in2="d" operator="in"/>
    </filter>

    <!-- 蓝色笔画加粗 -->
    <filter id="boldBlue" x="-20%" y="-20%" width="140%" height="140%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="0.55" result="d"/>
      <feFlood result="c" style="flood-color: var(--accent, #388CE8)"/>
      <feComposite in="c" in2="d" operator="in"/>
    </filter>

    <!-- 副标题加粗 -->
    <filter id="boldSub" x="-10%" y="-20%" width="120%" height="140%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="0.3" result="d"/>
      <feFlood result="c" style="flood-color: var(--text, #1E2229)"/>
      <feComposite in="c" in2="d" operator="in"/>
    </filter>
  </defs>

