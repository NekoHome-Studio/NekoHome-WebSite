<!DOCTYPE html>
<html lang="zh-CN" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NekoHome 工作室</title>
  <meta name="description" content="NekoHome 工作室官方网站" />
  <meta name="theme-color" content="#070a16" />
  <!-- 尽早设置主题，避免深浅色闪烁 -->
  <script>
    (function () {
      var t = localStorage.getItem('neko-theme');
      if (t !== 'light' && t !== 'dark') {
        t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-bs-theme', t);
    })();
  </script>
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg" />
  <link rel="stylesheet" href="vendor/bootstrap/bootstrap.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- 固定背景层：始终位于最底部，滚动时被各页面遮住 -->
  <div class="bg-layer" aria-hidden="true">
    <div class="bg-glow bg-glow-a"></div>
    <div class="bg-glow bg-glow-b"></div>
    <div class="bg-grid"></div>
    <div class="bg-mask"></div>
  </div>

  <!-- 顶栏：左 logo，右主题切换 + 三个导航标题 -->
  <header class="topbar" id="topbar">
    <a class="brand" href="#home">
      <img src="assets/logo.svg" alt="Logo" class="brand-logo" width="36" height="36" />
      <span class="brand-name" data-cfg="studioName">NekoHome 工作室</span>
    </a>
    <div class="topbar-right">
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="切换深浅色主题">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
        </svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
        </svg>
      </button>
      <nav class="nav" aria-label="主导航">
        <a class="nav-link is-active" href="#home">首页</a>
        <a class="nav-link" href="#about">关于</a>
        <a class="nav-link" href="#products">产品</a>
        <a class="nav-link" href="#join">加入</a>
        <span class="nav-indicator" aria-hidden="true"></span>
      </nav>
    </div>
  </header>

  <main>
    <!-- 第 1 页 · 首页 -->
    <section class="hero" id="home">
      <div class="hero-stage">
        <div class="hero-inner">
          <p class="hero-eyebrow" data-cfg="heroTags">独立 · 开源 · 创造</p>
          <h1 class="hero-title" data-cfg="studioName">NekoHome 工作室</h1>
          <p class="hero-slogan" data-cfg="slogan">把灵感，做成作品</p>
        </div>
      </div>
      <a class="scroll-hint" href="#about">
        <span>向下滚动</span>
        <span class="scroll-hint-line"><i></i></span>
      </a>
    </section>

    <!-- 第 2 页 · 关于 -->
    <section class="panel" id="about">
      <div class="panel-inner container-xl">
        <div class="row align-items-center g-5">
          <div class="col-lg-6 reveal">
            <article class="about-card">
              <span class="kicker">ABOUT US</span>
              <h2 class="panel-title" data-cfg="about.title">关于我们</h2>
              <div class="about-text" data-cfg-list="about.paragraphs"></div>
              <ul class="about-tags" data-cfg-tags="about.tags"></ul>
            </article>
          </div>
          <div class="col-lg-6 reveal" style="--d: .12s">
            <figure class="about-media">
              <img src="assets/about.svg" alt="工作室形象图" width="800" height="600" loading="lazy" />
            </figure>
          </div>
        </div>
      </div>
    </section>

    <!-- 第 3 页 · 产品 -->
    <section class="panel" id="products">
      <div class="panel-inner container-xl">
        <div class="text-center reveal">
          <span class="kicker">OPEN SOURCE</span>
          <h2 class="panel-title">我们的产品</h2>
          <p class="panel-sub">开源作品一览 · 数据来自 GitHub 实时解析</p>
        </div>
        <!-- 仓库卡片由 js/app.js 根据 data/repos.json 自动渲染 -->
        <div class="repo-grid row g-4" id="repo-grid"></div>
      </div>
    </section>

    <!-- 第 4 页 · 加入我们 -->
    <section class="panel" id="join">
      <div class="panel-inner container-xl">
        <div class="text-center reveal">
          <span class="kicker">JOIN US</span>
          <h2 class="panel-title" data-cfg="join.title">加入我们</h2>
          <p class="panel-sub" data-cfg="join.description"></p>
        </div>
        <div class="qq-card reveal" style="--d: .1s">
          <div class="qq-row">
            <span class="qq-label">QQ 群号</span>
            <code class="qq-number" id="qq-number">—</code>
            <button class="btn-ghost btn-sm" id="copy-qq" type="button">复制</button>
          </div>
          <a class="btn-primary" id="qq-join" href="#" target="_blank" rel="noopener">一键加入群聊</a>
          <p class="qq-tip">点击复制群号，或一键跳转 QQ 加群</p>
        </div>
      </div>
    </section>
  </main>

  <!-- 页脚 -->
  <footer class="footer">
    <div class="footer-inner container-xl">
      <a class="footer-brand" href="#home">
        <img src="assets/logo.svg" alt="" class="footer-logo" width="52" height="52" />
        <span class="footer-name" data-cfg="studioName">NekoHome 工作室</span>
      </a>
      <nav class="footer-nav">
        <a href="#home">首页</a>
        <a href="#about">关于</a>
        <a href="#products">产品</a>
        <a href="#join">加入</a>
      </nav>
      <div class="footer-icp">
        <span>© <span id="year"></span> <span data-cfg="studioName">NekoHome 工作室</span></span>
        <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener" id="icp-link"></a>
      </div>
    </div>
  </footer>

  <div class="toast" id="toast" role="status"></div>

  <script src="vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
